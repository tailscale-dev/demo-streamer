<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>demo-streamer</title>
    <link rel="icon" type="image/x-icon" href="/ui/favicon.ico">
    <style>
      body {
        background-color: #1c3058; /* same as tailscale.com/enterprise */

        font-family: ui-sans-serif, system-ui;
        color: #eee;
        font-size: 1.2em;
      }
      #marketing {
        position: absolute;
        min-width: 500px;
        top: 35%;
        left: 30%;
      }
      #marketing h1 {
        font-size: 3em;
        margin: 0 0 10px 0;
      }
      .carousel-arrow {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        background: transparent;
        border: none;
        color: #eee;
        font-size: 1.6em;
        line-height: 1;
        cursor: pointer;
        user-select: none;
        z-index: 5;
      }
      #carousel-prev {
        left: 20px;
      }
      #carousel-next {
        right: 20px;
      }
      .carousel-arrow:hover,
      .carousel-arrow:focus {
        color: #fff;
      }
      .carousel-arrow:focus-visible {
        outline: 1px dashed #eee;
      }
      #marketing ul {
        list-style-type: square;
        padding-left: 25px;
      }
      #messages > li {
        font-size: 1.4em;
        margin-bottom: 0.2em;
      }
      #logo {
        position: fixed;
        right: 20px;
        bottom: 20px;

        width: 250px;
      }
      #user-profile {
        z-index: 10;
        display: block;

        position: fixed;
        right: 20px;
        top: 20px;
        padding: 16px;

        background-color: white;
        color: rgb(48, 44, 44);

        border-width: 1px;
        border-radius: .5rem;

        line-height: 24px;
      }
      #user-profile-details {
        padding-bottom: 1em;
      }
      #user-profile-name {
        text-transform: capitalize;
      }
      #user-profile-email {
        text-transform: lowercase;
      }
      #status {
        display: block;
      }
    </style>
  </head>
  
  <body>
    <canvas id="funnel"></canvas>
    <button id="carousel-prev" class="carousel-arrow" type="button" aria-label="Previous product">&#8249;</button>
    <div id="marketing">
      <h1 id="product-title">Tailscale</h1>
      <ul id="messages">
        <li contenteditable="true" spellcheck="false">Zero Trust Programmable Networking</li>
        <li contenteditable="true" spellcheck="false">Single sign-on (SSO) for your network</li>
        <li contenteditable="true" spellcheck="false">Based on WireGuard®</li>
      </ul>
    </div>
    <button id="carousel-next" class="carousel-arrow" type="button" aria-label="Next product">&#8250;</button>

    <div id="user-profile">
      <div id="user-profile-details">
        <div id="user-profile-name"><strong id="display-name">Loading...</strong></div>
        <div id="user-profile-email" style="display: none;"></div>
      </div>
      <div id="status">🟡 Checking connection...</div>
    </div>

    <img id="logo" src="/ui/Tailscale-Logo-White.png" />
  </body>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.12.0/matter.min.js"></script>
  <script type="text/javascript">
    // http://unscriptable.com/2009/03/20/debouncing-javascript-methods/
    var debounce = function (func, threshold, execAsap) {
      var timeout;

      return function debounced() {
        var obj = this,
          args = arguments;
        function delayed() {
          if (!execAsap) func.apply(obj, args);
          timeout = null;
        }

        if (timeout) clearTimeout(timeout);
        else if (execAsap) func.apply(obj, args);

        timeout = setTimeout(delayed, threshold || 100);
      };
    };
  </script>
  <script>
    /**
     * Save messages to localStorage on changes.
     */
    const world = document.getElementById("funnel");
    const messageBox = document.getElementById("marketing");
    const messages = document.getElementById("messages");
    const titleEl = document.getElementById("product-title");

    const PRODUCTS = [
      { key: "tailscale", title: "Tailscale", storageKey: "messages-tailscale", defaultHTML: null },
      {
        key: "tailscale-pam",
        title: "Tailscale PAM",
        storageKey: "messages-tailscale-pam",
        defaultHTML: `<li contenteditable="true" spellcheck="false">Item 1</li>
        <li contenteditable="true" spellcheck="false">Item 2</li>
        <li contenteditable="true" spellcheck="false">Item 3</li>`,
      },
      {
        key: "tailscale-aperture",
        title: "Tailscale Aperture",
        storageKey: "messages-tailscale-aperture",
        defaultHTML: `<li contenteditable="true" spellcheck="false">Item 1</li>
        <li contenteditable="true" spellcheck="false">Item 2</li>
        <li contenteditable="true" spellcheck="false">Item 3</li>`,
      },
    ];

    let currentProductIndex = 0;

    function migrateLegacyMessages() {
      const tailscale = PRODUCTS[0];
      if (localStorage.getItem(tailscale.storageKey) == null) {
        const legacy = localStorage.getItem("messages");
        if (legacy != null) {
          console.log("migrating legacy 'messages' key to " + tailscale.storageKey);
          localStorage.setItem(tailscale.storageKey, legacy);
          localStorage.removeItem("messages");
        }
      }
    }

    function loadProductMessages(product) {
      const stored = localStorage.getItem(product.storageKey);
      return stored != null ? stored : product.defaultHTML;
    }

    function renderProduct(index) {
      currentProductIndex = index;
      const product = PRODUCTS[index];
      titleEl.textContent = product.title;
      messages.innerHTML = loadProductMessages(product);
      if (typeof repositionRamps === "function") {
        requestAnimationFrame(repositionRamps);
      }
    }

    function goToProduct(delta) {
      const n = PRODUCTS.length;
      renderProduct((currentProductIndex + delta + n) % n);
    }

    function initMessaging() {
      PRODUCTS[0].defaultHTML = messages.innerHTML;
      migrateLegacyMessages();
      renderProduct(0);

      const config = { childList: true, subtree: true, characterData: true };

      const repositionRampsOnEdit = debounce(() => {
        if (typeof repositionRamps === "function") repositionRamps();
      }, 150, false);

      const callback = () => {
        console.log("saving custom messages to local storage for " + PRODUCTS[currentProductIndex].key);
        localStorage.setItem(PRODUCTS[currentProductIndex].storageKey, messages.innerHTML);
        repositionRampsOnEdit();
      };
      const observer = new MutationObserver(callback);
      observer.observe(messages, config);

      document.getElementById("carousel-prev").addEventListener("click", () => goToProduct(-1));
      document.getElementById("carousel-next").addEventListener("click", () => goToProduct(1));

      document.addEventListener("keydown", (e) => {
        if (e.target && e.target.closest && e.target.closest("#messages")) return;
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          goToProduct(-1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          goToProduct(1);
        }
      });
    }
    initMessaging();
    
    /**
     * Animation.
     * All credit to https://github.com/shayne for the animation code.
     */
    const { Engine, Render, Runner, World, Bodies } = Matter;

    const edgeColor = "#1c3058";
    // const edgeColor = "#ddd";
    let engine = Engine.create();
    let ramps = [];

    // Balls have a 40px radius, so a ramp drawn exactly on the box's edge would
    // still let a ball's near side reach past it and touch the text.
    const BALL_CLEARANCE = 50;
    const RAMP_THICKNESS = 20;
    const RAMP_ANGLE = Math.PI * 0.06;
    const PEAK_RADIUS = 18;
    const rampRender = { fillStyle: edgeColor };

    // A ramp between two points, sized/angled to fit exactly between them.
    function rampBetween(p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const length = Math.max(Math.sqrt(dx * dx + dy * dy), 1);

      return Bodies.rectangle((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, length, RAMP_THICKNESS, {
        isStatic: true,
        angle: Math.atan2(dy, dx),
        render: rampRender,
      });
    }

    // Two ramps forming a shallow "roof" above the whole product box (title +
    // list), meeting at a single peak point and each sloping outward from
    // there. Any ball landing on either slope always keeps moving away from
    // the text and off the box's edge, so balls can't pool or bunch the way a
    // single long diagonal could. A small rounded cap sits at the peak, since
    // two straight ramps meeting at a point still leave a corner a ball can
    // wedge into. The roof is rebuilt from the box's live size, so it tracks
    // the text as it changes.
    function createRamps() {
      const box = messageBox.getBoundingClientRect();
      const apex = { x: box.left + box.width / 2, y: box.top - BALL_CLEARANCE };
      const halfSpan = box.width / 2 + BALL_CLEARANCE;
      const drop = halfSpan * Math.tan(RAMP_ANGLE);
      const leftEnd = { x: apex.x - halfSpan, y: apex.y + drop };
      const rightEnd = { x: apex.x + halfSpan, y: apex.y + drop };

      return [
        rampBetween(apex, leftEnd),
        rampBetween(apex, rightEnd),
        Bodies.circle(apex.x, apex.y, PEAK_RADIUS, { isStatic: true, render: rampRender }),
      ];
    }

    function repositionRamps() {
      ramps.forEach((ramp) => World.remove(engine.world, ramp));
      ramps = createRamps();
      World.add(engine.world, ramps);
    }

    const textures = [
      "https://user-images.githubusercontent.com/79330/224512133-beadac7e-2e05-402f-adf4-d439a95324a9.png", // TODO: move to this repo
      "https://user-images.githubusercontent.com/79330/224512134-4d979eb1-b940-4781-81f9-3e279da48018.png", // TODO: move to this repo
    ];
    function initAnimation() {
      let width = $(window).width();
      let height = $(window).height();

      engine.events = {};
      World.clear(engine.world);
      Engine.clear(engine);
      engine = Engine.create();
      engine.timing.timeScale = 0.9;

      let render = Render.create({
        canvas: world,
        engine: engine,
        options: {
          wireframes: false,
          background: "transparent",
          width: width,
          height: height,
        },
      });

      repositionRamps();

      function createBall() {
        const ORIGINAL_SIZE = 120;
        // const SIZE = Math.floor(Math.random() * 76) + 30;
        const SIZE = 100;
        const minX = 300;
        const maxX = 900;
        const ball = Bodies.circle(
          minX + Math.round(Math.random() * (maxX - minX)),
          -30,
          40,
          {
            friction: 0.001,
            frictionAir: 0.025,
            restitution: 0.5,
            density: 0.001,
            render: {
              sprite: {
                texture: textures[Math.floor(Math.random() * textures.length)],
                xScale: SIZE / ORIGINAL_SIZE,
                yScale: SIZE / ORIGINAL_SIZE,
              },
            },
          }
        );

        setTimeout(() => {
          World.remove(engine.world, ball);
        }, 20000);

        return ball;
      }

      Engine.run(engine);

      Render.run(render);

      const requestBallDrop = () => {
        const xhr = new XMLHttpRequest();
        xhr.timeout = 1000;

        errFn = () => {
          xhr.abort();
          console.log("error from backend");
          updateConnectionStatus(false, "Disconnected");
        };

        successFn = () => {
          if (xhr.readyState === xhr.DONE && xhr.status === 200) {
            World.add(engine.world, [createBall()]);
            updateConnectionStatus(true, "Connected");
          } else {
            errFn();
          }
        };

        xhr.onabort = errFn;
        xhr.onerror = errFn;
        xhr.ontimeout = errFn;
        xhr.onload = successFn;

        xhr.open("GET", "/api/uuid");
        xhr.send();
      };

      (function loop() {
        // https://developer.mozilla.org/en-US/docs/Web/API/setInterval#ensure_that_execution_duration_is_shorter_than_interval_frequency
        setTimeout(() => {
          requestBallDrop();
          loop();
        }, 155);
      })();

    }

    // User status management
    let lastUserStatus = null;
    
    function updateConnectionStatus(connected, message) {
      const statusElement = document.getElementById("status");
      if (connected) {
        const statusMessage = "🟢 " + message;
        document.title = statusMessage;
        statusElement.innerText = statusMessage;
      } else {
        const statusMessage = "🔴 " + message;
        document.title = statusMessage;  
        statusElement.innerText = statusMessage;
      }
    }
    
    function updateUserProfile(userStatus) {
      const detailsElement = document.getElementById("user-profile-details");
      const displayNameElement = document.getElementById("display-name");
      const emailElement = document.getElementById("user-profile-email");

      if (userStatus.connected && userStatus.loginName) {
        // User is connected and authenticated
        detailsElement.style.display = "block";
        displayNameElement.textContent = userStatus.displayName || userStatus.loginName;
        emailElement.textContent = userStatus.loginName;
        emailElement.style.display = "block";

        updateConnectionStatus(true, "Connected");
      } else if (userStatus.connected) {
        // Connected but no user info (might be connecting)
        detailsElement.style.display = "block";
        displayNameElement.textContent = "Connecting...";
        emailElement.style.display = "none";

        updateConnectionStatus(true, "Connecting");
      } else {
        // Not connected - hide the whole details block so its padding doesn't
        // leave empty space in the panel.
        detailsElement.style.display = "none";
        displayNameElement.textContent = "";
        emailElement.style.display = "none";

        updateConnectionStatus(false, userStatus.error || "Disconnected");
      }
    }
    
    function checkUserStatus() {
      const xhr = new XMLHttpRequest();
      xhr.timeout = 2000;
      
      xhr.onload = function() {
        if (xhr.readyState === xhr.DONE && xhr.status === 200) {
          try {
            const userStatus = JSON.parse(xhr.responseText);
            console.log("Received user status:", userStatus);
            console.log("Last user status:", lastUserStatus);
            
            // Always update if we don't have previous status, or if any key field has changed
            const statusChanged = !lastUserStatus || 
              lastUserStatus.connected !== userStatus.connected ||
              lastUserStatus.loginName !== userStatus.loginName ||
              lastUserStatus.displayName !== userStatus.displayName ||
              (lastUserStatus.error && !userStatus.error) || // recovered from error
              (!lastUserStatus.error && userStatus.error);   // new error occurred
              
            if (statusChanged) {
              console.log("User status changed, updating UI");
              updateUserProfile(userStatus);
              lastUserStatus = userStatus;
            } else {
              console.log("No status change detected");
            }
          } catch (e) {
            console.error("Failed to parse user status:", e);
            const errorStatus = {connected: false, error: "Disconnected"};
            updateUserProfile(errorStatus);
            lastUserStatus = errorStatus;
          }
        } else {
          console.log("Request failed with status:", xhr.status);
          const errorStatus = {connected: false, error: "Disconnected"};
          updateUserProfile(errorStatus);
          lastUserStatus = errorStatus;
        }
      };

      xhr.onerror = xhr.ontimeout = xhr.onabort = function() {
        console.log("Network error occurred");
        const errorStatus = {connected: false, error: "Disconnected"};
        updateUserProfile(errorStatus);
        lastUserStatus = errorStatus;
      };
      
      xhr.open("GET", "/api/user");
      xhr.send();
    }
    
    // Check user status more frequently than the ball drops
    setInterval(checkUserStatus, 1000); // Every 1 second
    
    // Initial check
    checkUserStatus();

    initAnimation();
    onresize = debounce(
      (event) => {
        console.log("reloading after window resize");
        window.location.reload();
      },
      500,
      false
    );
  </script>
</html>
